subprojects {
    apply plugin: 'scala'
    def compiler = System.getenv('CONSUMER_SCALA_VERSION')
    def suffix = '3'
    scala.scalaVersion = compiler
    tasks.withType(ScalaCompile).configureEach {
        scalaCompileOptions.deprecation = true
        scalaCompileOptions.additionalParameters = ['-release:25', '-feature', '-Werror']
    }
    dependencies {
        implementation "io.github.libtmux:libtmux-scala_${suffix}:${System.getenv('LIBTMUX_SCALA_VERSION')}"
        if (project.name == 'cats') {
            implementation "io.github.libtmux:libtmux-scala-cats_${suffix}:${System.getenv('LIBTMUX_SCALA_VERSION')}"
        }
        testImplementation "io.github.libtmux:libtmux-junit5:${System.getenv('LIBTMUX_JAVA_VERSION')}"
    }
    tasks.register('writeRuntime') {
        def runtime = configurations.runtimeClasspath
        def tests = configurations.testRuntimeClasspath
        def output = layout.projectDirectory
        doLast {
          output.file('build-tool.txt').asFile.text = gradle.gradleVersion + '\n'
          ['runtime': runtime, 'test': tests].each { name, artifacts ->
            def rows = artifacts.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                [id.group, id.name, id.version, artifact.file.canonicalPath].join('\t')
            }.sort()
            def reported = artifacts.resolvedConfiguration.resolvedArtifacts.collect { it.file }.toSet()
            assert reported == artifacts.files: 'Runtime artifact report is incomplete'
            output.file(name + '.tsv').asFile.text = rows.join('\n') + '\n'
          }
        }
    }
    tasks.register('verifyConsumer', JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'io.github.libtmux.scaladsl.consumer.' +
            (project.name == 'core' ? 'CoreConsumer' : 'CatsConsumer')
        doFirst {
            file('compiler.txt').text = tasks.compileTestScala.scalaClasspath.files
                .collect { it.name }.sort().join('\n') + '\n'
        }
    }
}
