      - name: Stage the Java prerequisite
        run: ./libtmux-scala/scripts/stage-java.sh

      - name: Run primary Scala checks
        env:
          TMUX_TEST_BINARY: ${{ env.TMUX_PREFIX }}/bin/tmux
        run: |
          libtmux-scala/sbtw \
            "++${{ matrix.scala }}" \
            scalafmtSbtCheck \
            scalafmtCheckAll \
            core/test \
            cats/test \
            integration/test \
            examples/test \
            core/doc \
            cats/doc \
            core/package \
            cats/package \
            benchmarks/compile

      - name: No tmux server outlived the cell
        if: always()
        run: |
          left="$(pgrep -c tmux || true)"
          if [ "${left:-0}" -ne 0 ]; then
            echo "::error::$left tmux server(s) survived ${{ matrix.id }}"
            for process in $(pgrep tmux); do ps -o command= -p "$process"; done
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: scala-runtime-${{ matrix.id }}-${{ github.sha }}
          path: libtmux-scala/target
          retention-days: 7

  # scala-release.yml trusts a check run named "Required checks", not this run's own conclusion: a
  # workflow_dispatch that only exercises the manual macOS cells skips every job below and still
  # concludes success, which named check run is the one thing that cannot happen without them.
  required:
    name: Required checks
    if: always()
    needs: [artifact-stage, producer-runtime, installed-consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every routine job succeeded
        env:
          ARTIFACT_STAGE: ${{ needs['artifact-stage'].result }}
          PRODUCER_RUNTIME: ${{ needs['producer-runtime'].result }}
          INSTALLED_CONSUMERS: ${{ needs['installed-consumers'].result }}
        run: |
          echo "artifact-stage: $ARTIFACT_STAGE"
          echo "producer-runtime: $PRODUCER_RUNTIME"
          echo "installed-consumers: $INSTALLED_CONSUMERS"
          for result in "$ARTIFACT_STAGE" "$PRODUCER_RUNTIME" "$INSTALLED_CONSUMERS"; do
            if [ "$result" != success ]; then
              echo "::error::a routine job did not succeed; this run does not cover the commit"
              exit 1
            fi
          done
