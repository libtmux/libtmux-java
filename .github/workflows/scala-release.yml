name: Scala release

# Scala artifacts are released only after their exact Java dependency is available from Central.
# A Java tag does not satisfy that condition by itself, so an owner starts this workflow manually.

on:
  workflow_dispatch:
    inputs:
      scala_version:
        description: 'Scala artifact version, for example 0.0.1-alpha.12'
        required: true
        type: string
      java_version:
        description: 'Already published Java dependency version'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  # To read whether this commit's Scala compatibility run passed.
  actions: read

jobs:
  publish:
    # Not tag-triggered: the Scala facade releases off master once the compatibility workflow has
    # passed on a commit there, never off a branch a dispatch could otherwise be pointed at.
    if: github.ref == 'refs/heads/master'
    # RELEASING.md records the one-time step this file cannot do: create this environment with a
    # master-only deployment policy and a required reviewer, and move the signing and Central
    # secrets into it. A workflow condition can refuse a branch; only the environment protects the
    # secrets themselves if that condition is ever wrong.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Staged artifacts, installed sbt and Gradle consumers, and both Scala families ran in the Scala
      # compatibility workflow for this commit; this job re-runs only the source tests.
      - name: Require this commit's Scala compatibility run to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/require-passed.sh "$GITHUB_SHA" scala-matrix.yml

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release inputs
        env:
          SCALA_VERSION: ${{ inputs.scala_version }}
          JAVA_VERSION: ${{ inputs.java_version }}
        run: |
          for version in "$SCALA_VERSION" "$JAVA_VERSION"; do
            case "$version" in
              *-SNAPSHOT|*-scala-dev.*)
                echo "::error::not a released coordinate: $version"
                exit 1
                ;;
            esac
            printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|milestone|rc)\.[0-9]+)?$' || {
              echo "::error::not a version this project publishes: $version"
              exit 1
            }
          done

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux

      # What is signed is what was tested: both Scala families, against the
      # published Java dependency, before any key is imported.
      - name: Test against the published Java dependency
        env:
          LIBTMUX_SCALA_RELEASE: central
          LIBTMUX_SCALA_VERSION: ${{ inputs.scala_version }}
          LIBTMUX_JAVA_VERSION: ${{ inputs.java_version }}
        run: |
          TMUX_TEST_BINARY="$(command -v tmux)"
          export TMUX_TEST_BINARY
          ./libtmux-scala/sbtw \
            '++2.13.18' core/test cats/test integration/test examples/test \
            '++3.3.8' core/test cats/test integration/test examples/test

      - name: Carry the passphrase only if the key has one
        env:
          PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$PASSPHRASE" ]; then
            echo "PGP_PASSPHRASE=$PASSPHRASE" >> "$GITHUB_ENV"
            echo "signing key has a passphrase"
          else
            echo "signing key has no passphrase"
          fi

      - name: Import signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          keyring="$RUNNER_TEMP/libtmux-scala-gpg"
          install -d -m 700 "$keyring"
          printf '%s' "$SIGNING_KEY" | gpg --batch --homedir "$keyring" --import
          echo "GNUPGHOME=$keyring" >> "$GITHUB_ENV"

      - name: Stage signed Scala artifacts
        env:
          LIBTMUX_SCALA_RELEASE: central
          LIBTMUX_SCALA_VERSION: ${{ inputs.scala_version }}
          LIBTMUX_JAVA_VERSION: ${{ inputs.java_version }}
        run: ./libtmux-scala/sbtw stageSigned

      - name: Verify signed staging
        env:
          SCALA_VERSION: ${{ inputs.scala_version }}
        run: |
          python3 libtmux-scala/scripts/verify-signatures.py \
            --stage libtmux-scala/target/sona-staging \
            --version "$SCALA_VERSION"

      - name: Upload the Scala deployment
        env:
          LIBTMUX_SCALA_RELEASE: central
          LIBTMUX_SCALA_VERSION: ${{ inputs.scala_version }}
          LIBTMUX_JAVA_VERSION: ${{ inputs.java_version }}
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./libtmux-scala/sbtw sonaUpload

      # The Portal records the files. This records which commit and workflow
      # produced them. A tag can be moved; the attestation cannot.
      - name: Attest the staged artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            libtmux-scala/target/sona-staging/**/*.jar
            libtmux-scala/target/sona-staging/**/*.pom

      - name: What to do next
        run: |
          echo "::notice::Scala deployment uploaded. Open https://central.sonatype.com/publishing/deployments and publish or drop it."
