name: Clojure compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Clojure checks (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          # Gradle runs on 25 in every lane (last entry is JAVA_HOME); the lane's JDK runs the Clojure.
          java-version: |
            ${{ matrix.java }}
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Run Clojure module and metadata checks
        run: >-
          ./gradlew :libtmux-clojure:check :libtmux-clojure-core-async:check
          clojureDependencyMetadata platformCoversEveryPublishedModule
          --rerun-tasks --stacktrace
          -PlibtmuxJavaVersion=${{ matrix.java }}

      - name: No tmux server outlived the suite
        if: always()
        run: uv run scripts/no-tmux-survivors/no_tmux_survivors.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-clojure-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7

  tmux:
    name: Clojure tmux ${{ matrix.tmux }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - name: Build tmux ${{ matrix.tmux }}
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
          prefix: ~/tmux-builds/${{ matrix.tmux }}
          add-to-path: "true"

      - name: The lane runs the tmux it is named after
        run: tmux -V

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          # Gradle runs on 25 in every lane (last entry is JAVA_HOME); the lane's JDK runs the Clojure.
          java-version: |
            ${{ matrix.java }}
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Run the native Clojure real-tmux suite
        env:
          LANE: ${{ matrix.tmux }}
        run: |
          ./gradlew :integration-tests:clojureIntegrationTest --rerun-tasks --stacktrace \
            -PlibtmuxJavaVersion=${{ matrix.java }} \
            "-PlibtmuxTmuxBinary=$HOME/tmux-builds/$LANE/bin/tmux" \
            "-PlibtmuxTmuxExpected=$LANE"

      - name: No tmux server outlived the suite
        if: always()
        run: uv run scripts/no-tmux-survivors/no_tmux_survivors.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-clojure-tmux-${{ matrix.tmux }}-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7

  macos:
    name: Clojure macOS tmux ${{ matrix.tmux }} (JDK ${{ matrix.java }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - name: Build tmux dependencies
        run: brew install libevent ncurses jemalloc bison pkg-config

      - name: Restore tmux ${{ matrix.tmux }}
        id: tmux-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/tmux-builds/${{ matrix.tmux }}
          key: clojure-tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}-jemalloc

      - name: Build tmux ${{ matrix.tmux }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          LANE: ${{ matrix.tmux }}
        run: uv run scripts/build-tmux-matrix/build_tmux_matrix.py ~/tmux-builds --only "$LANE"

      - name: The lane runs the tmux it is named after
        env:
          LANE: ${{ matrix.tmux }}
        run: >-
          "$HOME/tmux-builds/$LANE/bin/tmux" -V

      - name: Put the lane's tmux on the path
        env:
          LANE: ${{ matrix.tmux }}
        run: echo "$HOME/tmux-builds/$LANE/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          # Gradle runs on 25 in every lane (last entry is JAVA_HOME); the lane's JDK runs the Clojure.
          java-version: |
            ${{ matrix.java }}
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Run the native Clojure smoke and lifecycle suite
        env:
          LANE: ${{ matrix.tmux }}
        run: |
          ./gradlew :integration-tests:clojureIntegrationTest --rerun-tasks --stacktrace \
            -PlibtmuxJavaVersion=${{ matrix.java }} \
            "-PlibtmuxTmuxBinary=$HOME/tmux-builds/$LANE/bin/tmux" \
            "-PlibtmuxTmuxExpected=$LANE"

      - name: No tmux server outlived the suite
        if: always()
        run: uv run scripts/no-tmux-survivors/no_tmux_survivors.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-clojure-macos-${{ matrix.tmux }}-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7
