name: tmux matrix

# The README claims tmux 3.2a through 3.7c, and says that range is not a claim because the suite runs
# against every one of them. This is where that stops depending on someone running it locally.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a break that arrives from outside this repository — a runner image, a libevent, a
    # JDK — is found by the schedule rather than by the next person to open a pull request.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel a superseded run only on a pull request, where a new push genuinely replaces the answer.
# On master every commit's run stands on its own: grouping them all together meant re-running an
# older commit cancelled the newest one, which is the opposite of what a green history needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lanes:
    # Preview lanes carry their own label: this is the only place a reader sees which entries the
    # supported range does not include, since the README and the matrix property list only the rest.
    name: tmux ${{ matrix.tmux }}${{ matrix.experimental && ' (preview, not supported)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.tmux == 'master' && 25 || 15 }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # Must match the required lanes in build-logic/conventions/src/main/kotlin/libtmux.tmux-matrix.gradle.kts
        # (its `lanes` list), which is the source of truth. The agree step below fails if they drift
        # apart. This is also what DocumentationFactsTest reads the README's claimed range from, so a
        # preview lane belongs in `include` below and never here.
        tmux: ['3.2a', '3.3', '3.3a', '3.4', '3.5', '3.6', '3.7', '3.7a', '3.7b', '3.7c']
        # Ahead of the supported range, matching the plugin's `previewLanes` list: 3.8-rc is a
        # candidate for a release not yet cut, and master is upstream's development branch, not a
        # version. Both may fail and neither moves the README's claimed range.
        include:
          - tmux: '3.8-rc'
            experimental: true
          - tmux: master
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: This lane is one the build knows about
        env:
          LANE: ${{ matrix.tmux }}
        run: |
          plugin=build-logic/conventions/src/main/kotlin/libtmux.tmux-matrix.gradle.kts
          grep -q "\"$LANE\"" "$plugin" || {
            echo "::error::tmux $LANE is not a lane in $plugin"
            exit 1
          }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libevent-dev libncurses-dev bison pkg-config

      # master has no release tarball to build from a tag, so it is checked out and autoreconf'd
      # instead. autoconf and automake are needed only for that.
      - name: Build dependencies for a git checkout
        if: matrix.tmux == 'master'
        run: sudo apt-get install --no-install-recommends -y autoconf automake

      # Keyed by version alone: a released tarball does not change, so a hit is the same binary the
      # miss would have built. master has no such tarball and is never cached: it is upstream's
      # development head, which moves on every commit.
      - name: Restore tmux ${{ matrix.tmux }}
        if: matrix.tmux != 'master'
        id: tmux-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/tmux-builds/${{ matrix.tmux }}
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tmux ${{ matrix.tmux }}
        if: matrix.tmux != 'master' && steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          LANE: ${{ matrix.tmux }}
        run: |
          set -eux
          work="$(mktemp -d)"
          curl -fsSL -o "$work/tmux.tar.gz" \
            "https://github.com/tmux/tmux/releases/download/$LANE/tmux-$LANE.tar.gz"
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          cd "$work/tmux-$LANE"
          ./configure --prefix="$HOME/tmux-builds/$LANE"
          make -j"$(nproc)"
          make install

      # No release, no tag even: master is a moving branch, so it is built the way a contributor
      # without a dist tarball would, generating the files a tarball normally ships pre-built.
      - name: Build tmux master from a git checkout
        if: matrix.tmux == 'master'
        run: |
          set -eux
          git clone --depth 1 https://github.com/tmux/tmux.git "$HOME/tmux-src-master"
          cd "$HOME/tmux-src-master"
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-builds/master"
          make -j"$(nproc)"
          make install

      - name: The lane runs the tmux it is named after
        env:
          LANE: ${{ matrix.tmux }}
        run: |
          "$HOME/tmux-builds/$LANE/bin/tmux" -V

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true

      # One lane rather than testTmuxMatrix: each version builds and runs on its own runner, so the
      # lanes take the time of the slowest instead of the sum.
      - name: Run the real-tmux suite
        env:
          LANE: ${{ matrix.tmux }}
        run: ./gradlew "test-tmux-$LANE" -PlibtmuxMatrix="$HOME/tmux-builds" --stacktrace

      - name: No tmux server outlived the suite
        if: always()
        run: |
          left="$(pgrep -c tmux || true)"
          if [ "${left:-0}" -ne 0 ]; then
            echo "::error::$left tmux server(s) survived the suite"
            for p in $(pgrep tmux); do tr '\0' ' ' < "/proc/$p/cmdline"; echo; done
            exit 1
          fi
          echo "no tmux server survived the suite"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: reports-tmux-${{ matrix.tmux }}
          path: '**/build/reports/**'
          retention-days: 7
