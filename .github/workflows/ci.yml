name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, and a real-tmux suite is too
# expensive to keep running for an answer nobody will read.
# Cancel a superseded run only on a pull request, where a new push genuinely replaces the answer.
# On master every commit's run stands on its own: grouping them all together meant re-running an
# older commit cancelled the newest one, which is the opposite of what a green history needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  whitespace:
    name: git diff --check (pull request base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Trailing whitespace and a blank line at EOF are invisible in the rendered diff GitHub shows
      # in review. This is the same check `git apply --whitespace=warn` runs, against exactly what
      # the pull request changes rather than the whole tree.
      - name: No trailing whitespace or blank line at EOF
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  scripts:
    name: scripts/require-passed.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: ./scripts/require-passed.test.sh

  check:
    name: check (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 21 is the baseline the library compiles against; the newest LTS is here because a library
        # is run on JDKs its author never chose, and the ones that break it break at runtime.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          tmux -V

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # The wrapper jar is a binary this repository executes, so its checksum is verified against
          # the ones Gradle published rather than trusted because it is committed here.
          validate-wrappers: true

      # A venv keeps tmuxp off HOME: `pip install --user` lands there, and the
      # tests that need it replace HOME.
      - name: Install the optional workspace Python test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/workspace-python"
          "$RUNNER_TEMP/workspace-python/bin/python" -m pip install 'tmuxp==1.74.0'
          echo "TMUX_WORKSPACE_TEST_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"

      - run: ./gradlew :libtmux-mcp:test check --stacktrace --continue

      # A real-tmux suite that leaves servers running would be invisible here and expensive on a
      # developer's machine. The runner is discarded either way, so this is the only place the
      # question gets asked for free.
      - name: No tmux server outlived the suite
        if: always()
        run: |
          if pids="$(pgrep tmux)"; then
            echo "::error::tmux processes survived the suite"
            for pid in $pids; do ps -o command= -p "$pid" || true; done
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          echo "no tmux server survived the suite"

      - name: Publish to a local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: reports-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7

  check-macos:
    name: check (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux and Bash
        run: |
          brew install tmux bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          tmux -V

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true

      # Runs every check task instead of stopping at the first failure, so one run names them all.
      - run: ./gradlew :libtmux-mcp:test check --stacktrace --continue

      - name: No tmux server outlived the suite
        if: always()
        run: |
          if pids="$(pgrep tmux)"; then
            echo "::error::tmux processes survived the suite"
            for pid in $pids; do ps -o command= -p "$pid" || true; done
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          echo "no tmux server survived the suite"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: reports-macos
          path: '**/build/reports/**'
          retention-days: 7
