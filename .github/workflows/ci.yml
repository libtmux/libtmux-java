name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, and a real-tmux suite is too
# expensive to keep running for an answer nobody will read.
# Cancel a superseded run only on a pull request, where a new push genuinely replaces the answer.
# On master every commit's run stands on its own: grouping them all together meant re-running an
# older commit cancelled the newest one, which is the opposite of what a green history needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  whitespace:
    name: git diff --check (pull request base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Trailing whitespace and a blank line at EOF are invisible in the rendered diff GitHub shows
      # in review. This is the same check `git apply --whitespace=warn` runs, against exactly what
      # the pull request changes rather than the whole tree.
      - name: No trailing whitespace or blank line at EOF
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  check:
    name: check (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 25 is the baseline the library compiles against; the newest GA feature release is here
        # because a library is run on JDKs its author never chose, and the ones that break it break
        # at runtime.
        java: ['25', '27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --no-install-recommends --yes tmux

      - run: tmux -V

      # Gradle itself runs on the baseline in every lane: its plugins, the formatter among them,
      # reach into javac internals a newer JDK is free to change. The lane's JDK runs the tests.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The wrapper jar is a binary this repository executes, so its checksum is verified against
          # the ones Gradle published rather than trusted because it is committed here.
          validate-wrappers: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - name: Install the optional workspace Python test runtime
        uses: ./.github/actions/workspace-python

      # Continue past failures so one run names each failed check.
      # Clojure's live suite runs in its endpoint-only compatibility workflow.
      - run: >-
          ./gradlew :libtmux-mcp:test check --stacktrace --continue
          -Plibtmux.testJdk=${{ matrix.java }}
          -x :integration-tests:clojureIntegrationTest

      # A real-tmux suite that leaves servers running goes unnoticed here, because the runner is
      # discarded after the job, and costs memory on a developer's machine.
      - name: No tmux server outlived the suite
        if: always()
        run: uv run scripts/no-tmux-survivors/no_tmux_survivors.py

      - name: Publish to a local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7

  # The support scripts under scripts/ are typed Python with tests. The jobs that call one only run
  # it; this job formats, lints, type checks and tests them. The Python programs that tests drive
  # are test resources and get the same format, lint and type checks.
  scripts:
    name: scripts (ruff, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - name: Install the pinned script tools
        run: uv sync --project scripts --locked

      - name: Check script formatting
        run: >-
          uv run --project scripts --locked ruff format
          --config scripts/pyproject.toml
          --check
          scripts
          libtmux-workspace-cli/src/test/resources
          integration-tests/src/test/resources
          tools/mcp-swap/src/test/resources

      - name: Lint the scripts
        run: >-
          uv run --project scripts --locked ruff check
          --config scripts/pyproject.toml
          scripts
          libtmux-workspace-cli/src/test/resources
          integration-tests/src/test/resources
          tools/mcp-swap/src/test/resources

      - name: Type check the scripts
        run: >-
          uv run --project scripts --locked ty check
          --project scripts
          scripts
          libtmux-workspace-cli/src/test/resources
          integration-tests/src/test/resources
          tools/mcp-swap/src/test/resources

      - name: Test the scripts
        run: uv run --project scripts --locked pytest scripts

  # A release without the upload: the version a tag would publish, signed by a key made for this run,
  # checked against what the Central Portal refuses, then resolved by builds of their own that see
  # only those coordinates (module-tests/README.md). Nothing leaves the runner and no secret is read.
  rehearse-release:
    name: release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --no-install-recommends --yes tmux

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false

      - name: Work out the version a release would publish
        run: uv run scripts/release-checks/release_checks.py staged-version

      - name: Make a signing key for this run
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'libtmux release rehearsal <rehearsal@invalid>' rsa3072 sign 1d

      # The key reaches Gradle for this step only, so no log header prints it.
      - name: Stage the release
        run: |
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --armor --export-secret-keys)" \
            ./gradlew publishAllPublicationsToStagingRepository -PlibtmuxVersion="$VERSION" --stacktrace

      - name: The staged release is what Central accepts
        run: uv run scripts/verify-staged-release/verify_staged_release.py "$VERSION"

      - name: The Java build resolves the staged release
        run: ./gradlew -p module-tests/java run --stacktrace -PlibtmuxVersion="$VERSION"

      - name: The Kotlin build resolves the staged release
        run: ./gradlew -p module-tests/kotlin run --stacktrace -PlibtmuxVersion="$VERSION"

      - name: The Scala build resolves the staged release
        run: ./gradlew -p module-tests/scala run --stacktrace -PlibtmuxVersion="$VERSION"

      - name: The sbt build resolves the staged release
        run: module-tests/sbt/sbtw -Dlibtmux.version="$VERSION" core/run cats/run ox/run direct/run

      - name: The CLI build resolves the staged release
        run: ./gradlew -p module-tests/cli run --stacktrace -PlibtmuxVersion="$VERSION"
