name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, and a real-tmux suite is too
# expensive to keep running for an answer nobody will read.
# Cancel a superseded run only on a pull request, where a new push genuinely replaces the answer.
# On master every commit's run stands on its own: grouping them all together meant re-running an
# older commit cancelled the newest one, which is the opposite of what a green history needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  whitespace:
    name: git diff --check (pull request base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Trailing whitespace and a blank line at EOF are invisible in the rendered diff GitHub shows
      # in review. This is the same check `git apply --whitespace=warn` runs, against exactly what
      # the pull request changes rather than the whole tree.
      - name: No trailing whitespace or blank line at EOF
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  check:
    name: check (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 25 is the baseline the library compiles against; the newest GA feature release is here
        # because a library is run on JDKs its author never chose, and the ones that break it break
        # at runtime.
        java: ['25', '27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          tmux -V

      # Gradle itself runs on the baseline in every lane: its plugins, the formatter among them,
      # reach into javac internals a newer JDK is free to change. The lane's JDK runs the tests.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # The wrapper jar is a binary this repository executes, so its checksum is verified against
          # the ones Gradle published rather than trusted because it is committed here.
          validate-wrappers: true

      # Runs every check task instead of stopping at the first failure, so one run names them all.
      - run: ./gradlew check --stacktrace --continue -Plibtmux.testJdk=${{ matrix.java }}

      # A real-tmux suite that leaves servers running would be invisible here and expensive on a
      # developer's machine. The runner is discarded either way, so this is the only place the
      # question gets asked for free.
      - name: No tmux server outlived the suite
        if: always()
        run: |
          left="$(pgrep -c tmux || true)"
          if [ "${left:-0}" -ne 0 ]; then
            echo "::error::$left tmux server(s) survived the suite"
            for p in $(pgrep tmux); do tr '\0' ' ' < "/proc/$p/cmdline"; echo; done
            exit 1
          fi
          echo "no tmux server survived the suite"

      - name: Publish to a local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: reports-jdk${{ matrix.java }}
          path: '**/build/reports/**'
          retention-days: 7

  # A release without the upload: the version a tag would publish, signed by a key made for this run,
  # checked against what the Central Portal refuses, then resolved by builds of their own that see
  # only those coordinates (module-tests/README.md). Nothing leaves the runner and no secret is read.
  rehearse-release:
    name: release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true

      - name: Work out the version a release would publish
        run: |
          version="$(sed -n 's/^libtmuxVersion=//p' gradle.properties)"
          echo "VERSION=${version%-SNAPSHOT}" >> "$GITHUB_ENV"

      - name: Make a signing key for this run
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'libtmux release rehearsal <rehearsal@invalid>' rsa3072 sign 1d

      # The key reaches Gradle for this step only, so no log header prints it.
      - name: Stage the release
        run: |
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --armor --export-secret-keys)" \
            ./gradlew publishAllPublicationsToStagingRepository -PlibtmuxVersion="$VERSION" --stacktrace

      - name: The staged release is what Central accepts
        run: tools/verify-staged-release.sh "$VERSION"

      - name: Builds of their own resolve the staged release
        run: |
          ./gradlew -p module-tests/java run --stacktrace -PlibtmuxVersion="$VERSION"
          ./gradlew -p module-tests/kotlin run --stacktrace -PlibtmuxVersion="$VERSION"
          ./gradlew -p module-tests/scala run --stacktrace -PlibtmuxVersion="$VERSION"
          module-tests/sbt/sbtw -Dlibtmux.version="$VERSION" core/run cats/run ox/run direct/run

  check-macos:
    name: check (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    # Reported, never gating: hosted macOS runners fail this lane for reasons of their own too often
    # for its result to decide a merge or a release. Its failures still show in the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true

      # Runs every check task instead of stopping at the first failure, so one run names them all.
      - run: ./gradlew check --stacktrace --continue

      # No /proc on macOS, so a server's own command line comes from ps rather than cmdline.
      - name: No tmux server outlived the suite
        if: always()
        run: |
          left="$(pgrep -c tmux || true)"
          if [ "${left:-0}" -ne 0 ]; then
            echo "::error::$left tmux server(s) survived the suite"
            for p in $(pgrep tmux); do ps -o command= -p "$p"; done
            exit 1
          fi
          echo "no tmux server survived the suite"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: reports-macos
          path: '**/build/reports/**'
          retention-days: 7
