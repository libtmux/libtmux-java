[versions]
jspecify = "1.0.1"
kotlin = "2.4.10"
coroutines = "1.11.0"
junit = "5.14.4"
jackson = "2.21.5"
mcp = "2.0.1"
re2j = "1.8"
slf4j = "2.0.17"
tomlj = "1.1.1"
jsr305 = "3.0.2"
errorprone = "2.50.0"
nullaway = "0.13.8"
errorprone-plugin = "5.1.0"
spotless = "8.9.0"
maven-publish-plugin = "0.37.0"
palantir-format = "2.97.0"
cyclonedx-plugin = "3.4.1"
japicmp = "0.23.1"
picocli = "4.7.7"
reactive-streams = "1.0.4"
snakeyaml = "2.5"
testng-engine = "1.1.0"
javapoet = "0.20.0"
kotlinpoet = "2.4.0"
dokka = "2.2.0"
scala = "3.9.0"
scalafmt = "3.11.5"
munit = "1.3.6"
cats-effect = "3.7.1"
fs2 = "3.14.0"
ox = "1.0.8"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson2 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson2", version.ref = "mcp" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
kotlin-annotations-jvm = { module = "org.jetbrains.kotlin:kotlin-annotations-jvm", version.ref = "kotlin" }
asm = { module = "org.ow2.asm:asm", version = "9.9.1" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
reactive-streams-tck-flow = { module = "org.reactivestreams:reactive-streams-tck-flow", version.ref = "reactive-streams" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
testng-engine = { module = "org.junit.support:testng-engine", version.ref = "testng-engine" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
scala3-library = { module = "org.scala-lang:scala3-library_3", version.ref = "scala" }
munit = { module = "org.scalameta:munit_3", version.ref = "munit" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
cats-effect = { module = "org.typelevel:cats-effect_3", version.ref = "cats-effect" }
fs2-core = { module = "co.fs2:fs2-core_3", version.ref = "fs2" }
ox-core = { module = "com.softwaremill.ox:core_3", version.ref = "ox" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-plugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
