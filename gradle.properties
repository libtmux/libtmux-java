# The version every published module carries.
#
# alpha is the lowest qualifier Maven's own comparator knows — its order is
# alpha < beta < milestone < rc < snapshot < release < sp — so nothing this project
# publishes can sort below it. With a 0.0.x number in front, the coordinate says on
# its own that nothing here is settled.
#
# Trailing -SNAPSHOT because this is the development value, and a snapshot sorts below
# the release it precedes. A release overrides this with -PlibtmuxVersion, which is why
# it is a property and not a literal in the convention plugin. See RELEASING.md.
libtmuxVersion=0.0.1-alpha.15-SNAPSHOT

# The core module's API-diff gate compares this build's jar against the last released coordinate,
# io.github.libtmux:libtmux:<this>. Not derived from libtmuxVersion, which names the version being
# built rather than the one already shipped. Bump by hand when a release ships; see RELEASING.md.
libtmuxApiBaseline=0.0.1-alpha.14

# The build cache makes an unchanged module's compilation and its tests free on a second run, which
# is most of what a five-module build spends its time on.
org.gradle.caching=true

# Test tasks isolate their tmux sockets by checkout and task; fixtures track the owning JVM.
# Overlap independent projects while bounding aggregate worker use on shared hosts.
org.gradle.parallel=true
org.gradle.workers.max=2

# 512m is not enough for Error Prone and NullAway on this source tree.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
