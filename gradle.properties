# The version every published module carries. Overridden for a release with -PlibtmuxVersion=…,
# which is why the convention plugin reads it as a property rather than hard-coding it.
libtmuxVersion=0.1.0-SNAPSHOT

# The build cache makes an unchanged module's compilation and its tests free on a second run, which
# is most of what a five-module build spends its time on.
org.gradle.caching=true

# Deliberately not org.gradle.parallel. Four of the five modules run real tmux servers, and this
# repository shares /tmp with sibling ports whose leftovers already cost it intermittent failures —
# see AGENTS.md. Module-level parallelism would multiply the servers alive at once for a saving that
# has not been measured. Turn it on with a measurement, not on principle.

# 512m is not enough for Error Prone and NullAway on this source tree.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
