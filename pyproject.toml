# Tooling for the support scripts under scripts/. The Gradle build has no
# Python dependency and does not build or install this project.
[project]
name = "libtmux-java-scripts"
version = "0.0.0"
description = "Format, lint, type and test configuration for scripts/"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "ty>=0.0.101",
]

[tool.uv]
package = false
# Lock only releases at least three days old. Project settings override a
# contributor's own uv configuration, so `uv lock --check` gives the same
# answer on every machine. A relative value needs uv 0.9.17 or newer.
exclude-newer = "3 days"

[tool.pytest.ini_options]
# Each script is a plain module in its own directory, so tests import it by
# directory.
pythonpath = [
  "scripts/build-tmux-matrix",
  "scripts/ci-check",
  "scripts/check-tmux-build",
  "scripts/ci-plan",
  "scripts/no-tmux-survivors",
  "scripts/release-checks",
  "scripts/pty-helper",
  "scripts/reap-stale-servers",
  "scripts/verify-staged-release",
]
testpaths = ["scripts"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--doctest-modules",
  "--strict-config",
  "--strict-markers",
  "-p",
  "no:cacheprovider",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "scripts/build-tmux-matrix",
  "scripts/ci-check",
  "scripts/check-tmux-build",
  "scripts/ci-plan",
  "scripts/no-tmux-survivors",
  "scripts/release-checks",
  "scripts/pty-helper",
  "scripts/reap-stale-servers",
  "scripts/verify-staged-release",
]

[tool.ruff.lint]
extend-select = ["ANN", "B", "C4", "I", "PT", "PTH", "RUF", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "scripts/build-tmux-matrix",
  "scripts/ci-check",
  "scripts/check-tmux-build",
  "scripts/ci-plan",
  "scripts/no-tmux-survivors",
  "scripts/release-checks",
  "scripts/pty-helper",
  "scripts/reap-stale-servers",
  "scripts/verify-staged-release",
]

[tool.ty.src]
include = [
  "scripts",
  "libtmux-workspace-cli/src/test/resources",
  "integration-tests/src/test/resources",
]
