# Tooling for the support scripts under scripts/. The Gradle build has no
# Python dependency and does not build or install this project.
[project]
name = "libtmux-java-scripts"
version = "0.0.0"
description = "Format, lint, type and test configuration for scripts/"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "ty>=0.0.101",
]

[tool.uv]
package = false
# Lock only releases at least three days old. Project settings override a
# contributor's own uv configuration, so `uv lock --project scripts --check`
# gives the same answer on every machine. A relative value needs uv 0.9.17 or
# newer.
exclude-newer = "3 days"

[tool.pytest.ini_options]
# Each script is a plain module in its own directory, so tests import it by
# directory.
pythonpath = [
  "build-tmux-matrix",
  "lib",
  "ci-check",
  "check-tmux-build",
  "ci-plan",
  "no-tmux-survivors",
  "release-checks",
  "pty-helper",
  "reap-stale-servers",
  "verify-staged-release",
]
testpaths = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--doctest-modules",
  "--strict-config",
  "--strict-markers",
  "-p",
  "no:cacheprovider",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "build-tmux-matrix",
  "lib",
  "ci-check",
  "check-tmux-build",
  "ci-plan",
  "no-tmux-survivors",
  "release-checks",
  "pty-helper",
  "reap-stale-servers",
  "verify-staged-release",
]

[tool.ruff.lint]
extend-select = ["ANN", "B", "C4", "I", "PT", "PTH", "RUF", "SIM", "UP"]

# `--config` from the repository root resolves `src` against CWD, not `scripts/`.
[tool.ruff.lint.isort]
known-first-party = [
  "bounded",
  "build_tmux_matrix",
  "check_tmux_build",
  "ci_check",
  "ci_plan",
  "no_tmux_survivors",
  "pty_helper",
  "reap_stale_servers",
  "release_checks",
  "verify_staged_release",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "build-tmux-matrix",
  "lib",
  "ci-check",
  "check-tmux-build",
  "ci-plan",
  "no-tmux-survivors",
  "release-checks",
  "pty-helper",
  "reap-stale-servers",
  "verify-staged-release",
]
