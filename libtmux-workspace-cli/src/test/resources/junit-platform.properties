# A test that hangs fails here, by name, instead of running until CI cancels the whole lane. The
# separate thread is what lets a test blocked in a native read, which no interrupt ends, be reported.
# JUnit abandons that thread rather than stopping it, so the test's own cleanup does not run: a tmux
# server it started stays in the task's quarantine, which the next run of the task reports.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
